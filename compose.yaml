name: rag3

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: rag3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15432:5432"
    volumes:
      - rag3_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: rag3-qdrant
    restart: unless-stopped
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - rag3_qdrant_data:/qdrant/storage

volumes:
  rag3_postgres_data:
    external: true
    name: rag3_postgres_data
  rag3_qdrant_data:
    external: true
    name: rag3_qdrant_data

