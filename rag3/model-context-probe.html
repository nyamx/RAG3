<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG3 model context probe</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}
body{margin:0;padding:16px;background:Canvas;color:CanvasText}
main{max-width:680px;margin:auto}h2{font-size:18px;margin:0 0 8px}
p{line-height:1.5;margin:8px 0}button{padding:7px 10px;margin:4px 4px 4px 0;cursor:pointer}
#result{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;padding:8px;border:1px solid GrayText}
</style></head><body><main>
<h2>RAG3 model-context channel test</h2>
<p>UI → ChatGPT 모델 전달 확인을 위한 독립 실험. 원본 파일 처리·ingestion에는 영향 없음.</p>
<p id="caps">호스트 연결 확인 중</p>
<button id="context" disabled>1. ui/update-model-context 전송</button>
<button id="check" disabled>2. ui/message로 수신 확인</button>
<button id="message" disabled>3. ui/message 직접 전송</button>
<button id="state" disabled>4. setWidgetState modelContent</button>
<p id="result" role="status">실험 전</p>
</main><script>
'use strict';
const $ = id => document.getElementById(id);
const pending = new Map(); let nextId=1, connected=false, capabilities={};
const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);
const challenge='R3CTX-'+Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');
function info(s){$('result').textContent=s;}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params){return new Promise((resolve,reject)=>{
  const id=nextId++;
  const timer=setTimeout(()=>{pending.delete(id);reject(new Error('호스트 요청 시간 초과: '+method));},15000);
  pending.set(id,{resolve,reject,timer});
  window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
});}
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;
  const m=event.data;
  if(!m.method&&pending.has(m.id)){
    const item=pending.get(m.id);pending.delete(m.id);clearTimeout(item.timer);
    if(m.error)item.reject(new Error(m.error.message||'호스트 오류'));
    else item.resolve(m.result);
  }else if(m.method==='ping')notifyResponse(m.id,{});
  else if(m.method==='ui/resource-teardown'){
    for(const item of pending.values()){clearTimeout(item.timer);item.reject(new Error('위젯 종료'));}
    pending.clear();notifyResponse(m.id,{});
  }
});
function notifyResponse(id,result){window.parent.postMessage({jsonrpc:'2.0',id,result},'*');}
const text='This challenge is generated INSIDE the RAG3 widget and does not appear in the model-visible tool output. Token: '+challenge;
async function doRequest(method,params){
  try{info('요청 중: '+method);const result=await request(method,params);
    info(method+' 응답 수신: '+JSON.stringify(result).slice(0,400)+'\nToken은 위젯 내부에서만 생성됩니다.');
  }catch(e){info(method+' 거부 또는 실패: '+e.message);}
}
$('context').onclick=()=>doRequest('ui/update-model-context',{
  content:[{type:'text',text}],structuredContent:{probe:'RAG3_WIDGET_TEXT_CHANNEL',challenge}
});
$('check').onclick=()=>doRequest('ui/message',{
  role:'user',content:[{type:'text',text:'RAG3 독립 실험: 이 메시지에 토큰을 직접 넣지 않았습니다. 이전 ui/update-model-context에서 받은 R3CTX- 토큰을 그대로 답하세요. 받은 게 없다면 NOT_VISIBLE로 답하세요. RAG3 도구를 호출하지 마세요.'}]
});
$('message').onclick=()=>doRequest('ui/message',{
  role:'user',content:[{type:'text',text:'RAG3 ui/message 직접 전송 테스트. 아래 토큰을 답하세요: '+challenge}]
});
$('state').onclick=()=>{
  try{if(typeof window.openai?.setWidgetState!=='function')throw new Error('OpenAI widget API 미지원');
    window.openai.setWidgetState({modelContent:text,privateContent:{experiment:'RAG3 probe'}});
    info('setWidgetState 호출 완료 (모델에서 보이는지는 별도 확인 필요).');
  }catch(e){info('setWidgetState 실패: '+e.message);}
};
request('ui/initialize',{appInfo:{name:'RAG3 context probe',version:'1.0.0'},
 appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'
}).then(result=>{
  connected=true;capabilities=result.hostCapabilities||{};
  notify('ui/notifications/initialized',{});
  $('caps').textContent='호스트 선언: updateModelContext='+Boolean(capabilities.updateModelContext)+
    ', message='+Boolean(capabilities.message)+', widgetState='+Boolean(window.openai?.setWidgetState);
  for(const id of ['context','check','message','state'])$(id).disabled=false;
  info('호스트 연결 완료. 순서대로 1 → 2를 누르면 컨텍스트 전송을 검증할 수 있습니다.');
  notify('ui/notifications/size-changed',{height:270});
}).catch(e=>info('ui/initialize 실패: '+e.message));
</script></body></html>
