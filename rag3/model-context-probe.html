<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG3 model context probe</title>
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}
body{margin:0;padding:16px;background:Canvas;color:CanvasText}
main{max-width:680px;margin:auto}h2{font-size:18px;margin:0 0 8px}
p{line-height:1.5;margin:8px 0}button{padding:7px 10px;margin:4px 4px 4px 0;cursor:pointer}
#result{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;padding:8px;border:1px solid GrayText}
</style></head><body><main>
<h2>RAG3 model-context channel test</h2>
<p>UI → ChatGPT 모델 전달 확인을 위한 독립 실험. 원본 파일 처리·ingestion에는 영향 없음.</p>
<p id="caps">호스트 연결 확인 중</p>
<button id="context" disabled>1. ui/update-model-context 전송</button>
<button id="check" disabled>2. ui/message로 수신 확인</button>
<button id="message" disabled>3. ui/message 직접 전송</button>
<button id="state" disabled>4. setWidgetState 고유 토큰</button>
<button id="pdfcontext" disabled>5. PDF EmbeddedResource → model-context</button>
<button id="pdfmessage" disabled>6. PDF EmbeddedResource → ui/message</button>
<button id="pdflink" disabled>7. PDF ResourceLink(data: URI) → ui/message</button>
<button id="realpage40" disabled>8. 원본 PDF 40쪽 → model-context</button>
<button id="realpage100" disabled>9. 원본 PDF 100쪽 → ui/message</button>
<button id="realpage100ctx" disabled>10. 원본 100쪽 → model-context → 텍스트 message</button>
<button id="reveal" disabled>결과 대조용 토큰 표시 (응답 후)</button>
<p id="result" role="status">실험 전</p>
</main><script>
'use strict';
const $ = id => document.getElementById(id);
const pending = new Map(); let nextId=1, connected=false, capabilities={};
const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);
const challenge='R3CTX-'+Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');
function info(s){$('result').textContent=s;}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params,timeoutMs=15000){return new Promise((resolve,reject)=>{
  const id=nextId++;
  const timer=setTimeout(()=>{pending.delete(id);reject(new Error('위젯 응답 대기 시간 초과 ('+Math.round(timeoutMs/1000)+'초): '+method));},timeoutMs);
  pending.set(id,{resolve,reject,timer});
  window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
});}
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;
  const m=event.data;
  if(!m.method&&pending.has(m.id)){
    const item=pending.get(m.id);pending.delete(m.id);clearTimeout(item.timer);
    if(m.error)item.reject(new Error(m.error.message||'호스트 오류'));
    else item.resolve(m.result);
  }else if(m.method==='ping')notifyResponse(m.id,{});
  else if(m.method==='ui/resource-teardown'){
    for(const item of pending.values()){clearTimeout(item.timer);item.reject(new Error('위젯 종료'));}
    pending.clear();notifyResponse(m.id,{});
  }
});
function notifyResponse(id,result){window.parent.postMessage({jsonrpc:'2.0',id,result},'*');}
const text='This challenge is generated INSIDE the RAG3 widget and does not appear in the model-visible tool output. Token: '+challenge;
async function doRequest(method,params){
  try{info('요청 중: '+method);const result=await request(method,params);
    info(method+' 응답 수신: '+JSON.stringify(result).slice(0,400)+'\nToken은 위젯 내부에서만 생성됩니다.');
  }catch(e){info(method+' 거부 또는 실패: '+e.message);}
}
$('context').onclick=()=>doRequest('ui/update-model-context',{
  content:[{type:'text',text}],structuredContent:{probe:'RAG3_WIDGET_TEXT_CHANNEL',challenge}
});
$('check').onclick=()=>doRequest('ui/message',{
  role:'user',content:[{type:'text',text:'RAG3 독립 실험: 이 메시지에 토큰을 직접 넣지 않았습니다. 이전 ui/update-model-context에서 받은 R3CTX- 토큰을 그대로 답하세요. 받은 게 없다면 NOT_VISIBLE로 답하세요. RAG3 도구를 호출하지 마세요.'}]
});
$('message').onclick=()=>doRequest('ui/message',{
  role:'user',content:[{type:'text',text:'RAG3 ui/message 직접 전송 테스트. 아래 토큰을 답하세요: '+challenge}]
});
// Independent secrets are never put into tool results or outgoing test instructions.
// Do not click "reveal" until AFTER asking the model for its answer.
const expected={};
function token(prefix){
  const v=new Uint8Array(10);crypto.getRandomValues(v);
  return prefix+'-'+Array.from(v,b=>b.toString(16).padStart(2,'0')).join('');
}
$('state').onclick=async()=>{
  try {
    if(typeof window.openai?.setWidgetState!=='function')throw new Error('OpenAI widget API 미지원');
    const value=token('R3STATE');
    await window.openai.setWidgetState({
      modelContent:'Widget state ONLY: The unique state-only challenge is '+value+'.',
      privateContent:{experiment:'RAG3 state-isolated-v2'}
    });
    expected.state=value;
    info('4번 위젯 상태 저장 완료. 지금 ChatGPT에 "위젯 상태에만 있는 R3STATE- 토큰을 출력해"라고 질문하세요. 이전 대화에서 추측하지 마세요.');
  }catch(e){info('4번 setWidgetState 실패: '+e.message);}
};
// Small self-contained valid one-page ASCII PDF. Marker occurs ONLY in its PDF stream.
// This is an isolated transport test, not the user's RAG3 document or ingestion.
function createPdf(marker){
  const stream='BT /F1 16 Tf 48 740 Td (RAG3 PRIVATE PDF MARKER: '+marker+') Tj ET\n';
  const objects=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
    '<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream'
  ];
  let pdf='%PDF-1.4\n';const offsets=[0];
  for(let i=0;i<objects.length;i++){
    offsets.push(pdf.length);
    pdf+=(i+1)+' 0 obj\n'+objects[i]+'\nendobj\n';
  }
  const startxref=pdf.length;
  pdf+='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+startxref+'\n%%EOF\n';
  return {blob:btoa(pdf), bytes:pdf.length};
}
function makeResource(prefix){
  const marker=token(prefix);
  const pdf=createPdf(marker);
  const uri='rag3-probe://context-pdf/'+prefix.toLowerCase()+'/'+marker+'.pdf';
  return {marker,pdf,uri, block:{type:'resource',resource:{uri,mimeType:'application/pdf',blob:pdf.blob}}};
}
$('pdfcontext').onclick=async()=>{
  const d=makeResource('R3PDFCTX');
  try{
    const ret=await request('ui/update-model-context',{
      content:[d.block],structuredContent:{experiment:'rag3-pdf-embedded-v2',mode:'context'}
    });
    expected.pdfcontext=d.marker;
    info('5번 응답 수신: '+JSON.stringify(ret).slice(0,220)+
      '\nPDF EmbeddedResource '+d.pdf.bytes+' bytes. 토큰은 출력하지 않습니다. 다음 사용자 메시지에서 "방금 전달된 PDF 내부 R3PDFCTX- 토큰을 읽어라. 확인할 수 없으면 NOT_VISIBLE"이라고 질문하세요.');
  }catch(e){info('5번 실패: '+e.message);}
};
$('pdfmessage').onclick=async()=>{
  const d=makeResource('R3PDFMSG');
  try{
    expected.pdfmessage=d.marker;
    const ret=await request('ui/message',{role:'user',content:[
      {type:'text',text:'RAG3 PDF resource test: extract the R3PDFMSG- token from the attached PDF binary only. Never guess and never invoke RAG3 retrieval. If you cannot read PDF contents, answer NOT_VISIBLE.'},
      d.block
    ]});
    info('6번 응답 수신: '+JSON.stringify(ret).slice(0,220)+'\n모델 응답을 받은 뒤 토큰 대조 버튼을 누르세요.');
  }catch(e){info('6번 실패: '+e.message);}
};
$('pdflink').onclick=async()=>{
  const d=makeResource('R3PDFLINK');
  try{
    expected.pdflink=d.marker;
    const link={type:'resource_link',name:'rag3-pdf-link-test.pdf',mimeType:'application/pdf',
      uri:'data:application/pdf;base64,'+d.pdf.blob,size:d.pdf.bytes};
    const ret=await request('ui/message',{role:'user',content:[
      {type:'text',text:'RAG3 ResourceLink data-URI test: open the linked PDF and return its R3PDFLINK- token. If the data: URI cannot be opened or contents are not visible, answer NOT_VISIBLE.'},
      link
    ]});
    info('7번 응답 수신: '+JSON.stringify(ret).slice(0,220)+'\nData URI 호스트 지원 여부만 시험하므로, 실패해도 정식 MCP resource_link 실패로 일반화하지 않습니다.');
  }catch(e){info('7번 실패 (data URI 지원 여부): '+e.message);}
};
// Real original PDF: fetched via a private app-only MCP tool, not RAG retrieval.
// PDF bytes and ground-truth preview are deliberately excluded from model-facing tool output.
async function realPdfPart(page){
  const args={page};
  const result=capabilities.serverTools
    ?await request('tools/call',{name:'rag3_probe_real_pdf_page',arguments:args})
    :typeof window.openai?.callTool==='function'
      ?await window.openai.callTool('rag3_probe_real_pdf_page',args)
      :await request('tools/call',{name:'rag3_probe_real_pdf_page',arguments:args});
  if(result?.isError)throw new Error('앱 전용 PDF 전송 도구 실행 실패');
  const d=result?._meta?.['rag3/privatePdfProbe'];
  if(!d||d.page!==page||typeof d.pdf_base64!=='string')throw new Error('PDF 비공개 도구 응답 미수신');
  const bytes=Uint8Array.from(atob(d.pdf_base64),c=>c.charCodeAt(0));
  if(bytes.length!==d.size||await sha256hex(bytes)!==d.sha256)throw new Error('PDF SHA-256 불일치');
  if(bytes.length<1024||bytes.length>262144)throw new Error('PDF 실험 크기 초과');
  expected['realpage'+page]={sha256:d.sha256,page:page,preview:d.local_text_preview};
  return {data:d,content:{type:'resource',resource:{
    uri:'rag3-probe://original/page-'+page+'/'+d.sha256+'.pdf',
    mimeType:'application/pdf',blob:d.pdf_base64}}};
}
async function sha256hex(bytes){
  const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));
  return Array.from(digest,x=>x.toString(16).padStart(2,'0')).join('');
}
$('realpage40').onclick=async()=>{
  try{
    info('실제 원본 40쪽 PDF를 비공개 MCP 도구에서 확인 중...');
    const sample=await realPdfPart(40);
    const r=await request('ui/update-model-context',{
      content:[sample.content],structuredContent:{experiment:'rag3-original-pdf-40',bytes:sample.data.size}
    });
    info('8번 전송 성공: '+sample.data.size+' bytes, 호스트 응답: '+JSON.stringify(r).slice(0,140)+
      '\n다음 메시지로 "방금 전달된 실제 PDF 40페이지의 문장 일부를 그대로 옮겨라. RAG3 검색을 쓰지 말고, 접근할 수 없다면 NOT_VISIBLE"이라고 질문하세요.');
  }catch(e){info('8번 오류: '+e.message);}
};
$('realpage100').onclick=async()=>{
  try{
    info('실제 원본 100쪽 PDF를 비공개 MCP 도구에서 확인 중...');
    const sample=await realPdfPart(100);
    const r=await request('ui/message',{role:'user',content:[
      {type:'text',text:'Independent RAG3 original PDF page 100 trial. Extract a verbatim short sentence from the attached PDF page; do not call RAG3 retrieval, do not use previous chat context, do not guess. If you cannot read the PDF, answer NOT_VISIBLE.'},
      sample.content
    ]},120000);
    info('9번 메시지 전송 성공: '+sample.data.size+' bytes, 호스트 응답: '+JSON.stringify(r).slice(0,140)+
      '\n모델 답변 후에만 결과 대조용 버튼을 누르세요.');
  }catch(e){info('9번 오류: '+e.message);}
};
// Diagnostic comparison only: unlike button 9, the PDF is NOT inside ui/message.
// The resource is sent with ui/update-model-context; a subsequent text-only
// ui/message asks the host model to read that very same one-page PDF.
$('realpage100ctx').onclick=async()=>{
  try{
    info('10번: 비공개 원본 100쪽 PDF 조회 및 SHA-256 검사 중...');
    const sample=await realPdfPart(100);
    const nonce=token('R3STEP10');
    expected.realpage100ctx={sha256:sample.data.sha256,page:100,preview:sample.data.local_text_preview,nonce};
    info('10번: PDF '+sample.data.size+' bytes를 model-context로 전송 중...');
    const ctx=await request('ui/update-model-context',{
      content:[sample.content],
      structuredContent:{experiment:'rag3-original-page100-two-step',bytes:sample.data.size}
    },120000);
    info('10번: model-context 호스트 수신: '+JSON.stringify(ctx).slice(0,180)+'\n텍스트 전용 ui/message 전송 중...');
    const r=await request('ui/message',{role:'user',content:[
      {type:'text',text:'RAG3 diagnostic: This is a TEXT ONLY message. A separate model-context update just provided the original page 100 as a PDF resource. Echo '+nonce+' exactly, then give the FIRST complete sentence you can read directly from that PDF. Do not call RAG3 tools, do not guess from prior conversation. If the PDF is unavailable, respond '+nonce+' NOT_VISIBLE.'}
    ]},120000);
    info('10번 단계별 호출 완료: '+sample.data.size+' bytes PDF, ctx='+JSON.stringify(ctx).slice(0,110)+
      ', message='+JSON.stringify(r).slice(0,110)+'\n모델의 실제 PDF 문장 접근은 별도로 판정해야 합니다.');
  }catch(e){info('10번 오류: '+e.message);}
};
$('reveal').onclick=()=>{
  info('EXPECTED (모델이 답변한 뒤에만 대조): '+JSON.stringify(expected));
};
request('ui/initialize',{appInfo:{name:'RAG3 context probe',version:'1.0.0'},
 appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'
}).then(result=>{
  connected=true;capabilities=result.hostCapabilities||{};
  notify('ui/notifications/initialized',{});
  $('caps').textContent='호스트 선언: updateModelContext='+Boolean(capabilities.updateModelContext)+
    ', message='+Boolean(capabilities.message)+', widgetState='+Boolean(window.openai?.setWidgetState);
  for(const id of ['context','check','message','state','pdfcontext','pdfmessage','pdflink','realpage40','realpage100','realpage100ctx','reveal'])$(id).disabled=false;
  info('호스트 연결 완료. 순서대로 1 → 2를 누르면 컨텍스트 전송을 검증할 수 있습니다.');
  notify('ui/notifications/size-changed',{height:340});
}).catch(e=>info('ui/initialize 실패: '+e.message));
</script></body></html>
